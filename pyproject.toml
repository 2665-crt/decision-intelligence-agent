[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-analysis-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "plotly>=6,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2,<3",
  "statsmodels>=0.14,<1",
  "xlrd>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src", "services/executor/src"]
testpaths = ["apps/api/tests", "services/executor/tests"]

[tool.setuptools.packages.find]
where = ["apps/api/src", "services/executor/src"]
include = ["universal_agent*", "executor*"]
